version: '3.8'
services:
  manticore:
    container_name: manticore
    image: manticoresearch/manticore:latest
    restart: always
    ports:
      - 9306:9306
      - 9308:9308
      - 9312:9312
    ulimits:
      nproc: 65535
      nofile:
         soft: 65535
         hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./data:/var/lib/manticore
  
  api:
    container_name: kibombas-api
    build: ./kibombas-api 
    restart: always
    ports:
      - "8000:8000" 
    depends_on:
      - manticore
    env_file:
      - ./kibombas-api/.env
    environment:
      # - MANTICORE_SEARCH_URL=manticore:9308
      - PYTHONPATH=/app
    volumes:
      - ./kibombas-api:/app
    working_dir: /app  
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload